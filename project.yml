name: ShiftPay
options:
  bundleIdPrefix: com.mrhaibaoseal
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "3.0.0"
    CURRENT_PROJECT_VERSION: "300"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_KEY_CFBundleDisplayName: "打工薪水帳"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  ShiftPay:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ios/Shared
      - path: ios/ShiftPayApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mrhaibaoseal.shiftpay
        PRODUCT_NAME: ShiftPay
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "打工薪水帳"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "打工薪水帳需要行事曆權限，以便自動將您的排班表與雙重起床提醒同步寫入 iPhone 原生行事曆（免手動匯出 .ics）。"
        INFOPLIST_KEY_NSCalendarsWriteOnlyAccessUsageDescription: "打工薪水帳需要行事曆權限，以便自動將您的排班表與起床提醒寫入 iPhone 行事曆。"
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "打工薪水帳需要提醒事項權限，以便設定上班前一天與當日起床提醒。"
        INFOPLIST_KEY_NSCameraUsageDescription: "打工薪水帳需要相機權限，以便直接拍攝店內手寫排班表進行 AI 智慧辨識。"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "打工薪水帳需要相簿權限，以便選取多張手寫排班表照片進行跨頁 AI 合併辨識，以及儲存月底高清對帳單圖片。"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "打工薪水帳需要相簿權限，以便將月底薪資核對單圖片儲存至您的手機相簿。"
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - target: ShiftPayWidgetExtension
        embed: true

  ShiftPayWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ios/Shared
      - path: ios/ShiftPayWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mrhaibaoseal.shiftpay.widget
        PRODUCT_NAME: ShiftPayWidgetExtension
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "打工薪水帳小工具"
        INFOPLIST_KEY_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: YES
