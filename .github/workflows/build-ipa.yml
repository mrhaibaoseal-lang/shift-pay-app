name: Build iOS 27 Native IPA (Feather + FlareStore)

on:
  push:
    branches:
      - main
      - "cline/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Non-Alpha RGB App Icons (60x60@2x, 60x60@3x, 1024x1024)
        run: |
          mkdir -p ios/ShiftPayApp/Assets.xcassets/AppIcon.appiconset
          cat << 'EOF' > ios/ShiftPayApp/Assets.xcassets/Contents.json
          { "info" : { "author" : "xcode", "version" : 1 } }
          EOF
          cat << 'EOF' > ios/ShiftPayApp/Assets.xcassets/AppIcon.appiconset/Contents.json
          {
            "images" : [
              {
                "filename" : "AppIcon-60@2x.png",
                "idiom" : "iphone",
                "scale" : "2x",
                "size" : "60x60"
              },
              {
                "filename" : "AppIcon-60@3x.png",
                "idiom" : "iphone",
                "scale" : "3x",
                "size" : "60x60"
              },
              {
                "filename" : "AppIcon-1024.png",
                "idiom" : "ios-marketing",
                "scale" : "1x",
                "size" : "1024x1024"
              }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          EOF
          swift -e '
          import AppKit
          import CoreGraphics

          func makeIcon(px: Int, path: String) {
              let colorSpace = CGColorSpaceCreateDeviceRGB()
              guard let ctx = CGContext(
                  data: nil,
                  width: px,
                  height: px,
                  bitsPerComponent: 8,
                  bytesPerRow: px * 4,
                  space: colorSpace,
                  bitmapInfo: CGImageAlphaInfo.noneSkipLast.rawValue
              ) else { return }

              let colors = [
                  CGColor(red: 0.08, green: 0.14, blue: 0.24, alpha: 1.0),
                  CGColor(red: 0.04, green: 0.06, blue: 0.10, alpha: 1.0)
              ] as CFArray
              if let grad = CGGradient(colorsSpace: colorSpace, colors: colors, locations: [0.0, 1.0]) {
                  ctx.drawLinearGradient(grad, start: CGPoint(x: 0, y: px), end: CGPoint(x: px, y: 0), options: [])
              }

              NSGraphicsContext.saveGraphicsState()
              NSGraphicsContext.current = NSGraphicsContext(cgContext: ctx, flipped: false)
              let str = "💰" as NSString
              let fontSize = CGFloat(px) * 0.56
              let attrs: [NSAttributedString.Key: Any] = [.font: NSFont.systemFont(ofSize: fontSize)]
              let sSize = str.size(withAttributes: attrs)
              str.draw(at: NSPoint(x: (CGFloat(px) - sSize.width) / 2.0, y: (CGFloat(px) - sSize.height) / 2.0), withAttributes: attrs)
              NSGraphicsContext.restoreGraphicsState()

              if let cgImg = ctx.makeImage() {
                  let rep = NSBitmapImageRep(cgImage: cgImg)
                  if let png = rep.representation(using: .png, properties: [:]) {
                      try? png.write(to: URL(fileURLWithPath: path))
                  }
              }
          }

          makeIcon(px: 120, path: "ios/ShiftPayApp/Assets.xcassets/AppIcon.appiconset/AppIcon-60@2x.png")
          makeIcon(px: 180, path: "ios/ShiftPayApp/Assets.xcassets/AppIcon.appiconset/AppIcon-60@3x.png")
          makeIcon(px: 1024, path: "ios/ShiftPayApp/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png")
          '

      - name: Generate Xcode Project with XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate

      - name: Build Unsigned App & Widget Extension
        run: |
          xcodebuild clean build \
            -project ShiftPay.xcodeproj \
            -scheme ShiftPay \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Standard Feather IPA (Single-Bundle Guaranteed Install) & Widget IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "ShiftPay.app" | head -n 1)
          cp ios/ShiftPayApp/Assets.xcassets/AppIcon.appiconset/AppIcon-180.png "$APP_PATH/icon.png" 2>/dev/null || true

          # 1. 含 Widget 擴充版 (ShiftPay-iOS27-WithWidget.ipa)
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry ShiftPay-iOS27-WithWidget.ipa Payload

          # 2. 標準保證安裝版 (ShiftPay-iOS27-Feather.ipa) - 移除 PlugIns 子套件並預簽入乾淨權限
          rm -rf Payload/ShiftPay.app/PlugIns
          codesign --force --sign - --entitlements ios/ShiftPayApp/ShiftPay.entitlements Payload/ShiftPay.app
          zip -qry ShiftPay-iOS27-Feather.ipa Payload
          ls -lh ShiftPay-iOS27-Feather.ipa ShiftPay-iOS27-WithWidget.ipa

      - name: Upload IPAArtifact (Standard Guaranteed Install)
        uses: actions/upload-artifact@v4
        with:
          name: ShiftPay-iOS27-Feather-IPA
          path: ShiftPay-iOS27-Feather.ipa
          if-no-files-found: error

      - name: Publish to GitHub Release (latest-feather)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-feather --yes || true
          git push origin :refs/tags/latest-feather || true
          gh release create latest-feather \
            ShiftPay-iOS27-Feather.ipa \
            ShiftPay-iOS27-WithWidget.ipa \
            --title "打工薪水帳 V3.0.4 (iOS 27 原生版 - 原生連環鬧鐘 & 滑動切月版)" \
            --notes "v3.0.4 更新：1. 移除 Scriptable 複製 JSON 與行事曆同步，全面採用原生 WidgetKit 小工具與 iOS 原生連環起床鬧鐘（支援鎖定畫面「我已起床」與「貪睡 5 分鐘」） 2. 首頁月曆與薪資卡支援左右滑動切換月份 3. 完整支援點擊空白處與鍵盤上方「完成 ✓」收起數字鍵盤。"
