name: Build iOS 27 Native IPA (Feather + FlareStore)

on:
  push:
    branches:
      - main
      - "cline/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate App Icon Asset Catalog
        run: |
          mkdir -p ios/ShiftPayApp/Assets.xcassets/AppIcon.appiconset
          cat << 'EOF' > ios/ShiftPayApp/Assets.xcassets/Contents.json
          { "info" : { "author" : "xcode", "version" : 1 } }
          EOF
          cat << 'EOF' > ios/ShiftPayApp/Assets.xcassets/AppIcon.appiconset/Contents.json
          {
            "images" : [
              {
                "filename" : "AppIcon.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          EOF
          swift -e '
          import AppKit
          let size = NSSize(width: 1024, height: 1024)
          let img = NSImage(size: size)
          img.lockFocus()
          let grad = NSGradient(starting: NSColor(calibratedRed: 0.08, green: 0.14, blue: 0.23, alpha: 1.0),
                                ending: NSColor(calibratedRed: 0.04, green: 0.05, blue: 0.08, alpha: 1.0))
          grad?.draw(in: NSRect(origin: .zero, size: size), angle: -45)
          let str = "💰" as NSString
          let attrs: [NSAttributedString.Key: Any] = [.font: NSFont.systemFont(ofSize: 580)]
          let sSize = str.size(withAttributes: attrs)
          str.draw(at: NSPoint(x: (1024 - sSize.width) / 2, y: (1024 - sSize.height) / 2), withAttributes: attrs)
          img.unlockFocus()
          if let tiff = img.tiffRepresentation,
             let rep = NSBitmapImageRep(data: tiff),
             let png = rep.representation(using: .png, properties: [:]) {
              try? png.write(to: URL(fileURLWithPath: "ios/ShiftPayApp/Assets.xcassets/AppIcon.appiconset/AppIcon.png"))
          }
          '

      - name: Generate Xcode Project with XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate

      - name: Build Unsigned App & Widget Extension
        run: |
          xcodebuild clean build \
            -project ShiftPay.xcodeproj \
            -scheme ShiftPay \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Unsigned IPA for Feather
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "ShiftPay.app" | head -n 1)
          cp -R "$APP_PATH" Payload/
          zip -qry ShiftPay-iOS27-Feather.ipa Payload
          ls -lh ShiftPay-iOS27-Feather.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShiftPay-iOS27-Feather-IPA
          path: ShiftPay-iOS27-Feather.ipa
          if-no-files-found: error

      - name: Publish to GitHub Release (latest-feather)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-feather --yes || true
          git push origin :refs/tags/latest-feather || true
          gh release create latest-feather ShiftPay-iOS27-Feather.ipa \
            --title "打工薪水帳 V3.0 (iOS 27 原生版 - Feather 專用)" \
            --notes "包含主程式 ShiftPay.app 與桌面互動小工具/動態島 ShiftPayWidgetExtension.appex。可直接匯入 Feather 搭配 FlareStore 付費憑證簽名安裝。"
